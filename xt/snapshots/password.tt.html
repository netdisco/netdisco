<div class="container">
  <div class="row nd_hero-row">
    <div class="col-md-8 offset-md-2">
      <div class="hero-unit">
        <h2>Change Password</h2>
        <form class="nd_login-form" method="post" action="">
          <div class="form-horizontal">
            <input placeholder="Current Password" class="col-md-2" name="old" type="password" required="required"/><br/>
            <input placeholder="New Password" class="col-md-2" name="new" type="password" required="required"/>
            <input placeholder="Confirm New Password" class="col-md-2" name="confirm" type="password" required="required"/>
            <button type="submit" class="btn btn-info">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div> <!-- /container -->
