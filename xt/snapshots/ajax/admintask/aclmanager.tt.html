<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th class="nd_center-cell">ACL Name</th>
      <th class="nd_center-cell">ACL Type</th>
      <th class="nd_center-cell">Editor</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="nd_center-cell">
      <input class="form-control w-auto d-inline-block" size=25 data-form="add" name="acl_name" type="text">
      </td>
      <td class="nd_center-cell">
        <div class="form-group">
          <select class="form-select w-auto d-inline-block" data-form="add" name="acl_type">
            <option value="host">Host Group</option>
            <option value="host_host">Host to Host mapping</option>
            <option value="host_host">Ports on Hosts</option>
          </select>
        </div>
      </td>
      <td></td>
      <td class="nd_center-cell">
        <button class="btn btn-sm nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add</button>
      </td>
    </tr>

    <tr>
      <td class="nd_center-cell">
        <input class="form-control w-auto d-inline-block" size=25 data-form="update" name="acl_name" type="text" value="demo">
      </td>

      <td class="nd_center-cell">
        <div class="form-group">
          <select class="form-select w-auto d-inline-block" data-form="update" name="acl_type">
            <option selected value="host">Host Group</option>
            <option value="host_host">Host to Host mapping</option>
            <option value="host_port">Ports on Hosts</option>
          </select>
        </div>
      </td>

      <td class="nd_center-cell"><a class="btn"
        href="?acl_name=demo&acl_type=host"><i class="fas fa-list-ul fa-lg fa-border"></i> Edit Rules</a></td>

      <td class="nd_center-cell">
        <input data-form="update" name="old-acl_name" type="hidden" value="demo">
        <button class="btn nd_adminbutton" name="update" type="submit"><i class="far fa-floppy-disk text-warning"></i></button>

        <button class="btn" data-bs-toggle="modal"
          data-bs-target="#nd_devdel-1" type="button"><i class="fas fa-trash-can text-danger"></i></button>

        <div id="nd_devdel-1" class="nd_modal nd_deep-horizon modal fade" tabindex="-1"
          role="dialog" aria-labelledby="nd_devdel-label-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h3 id="nd_devdel-label-1">Are you sure?</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <blockquote>
                  <p class="text-info">
                    The ACL &quot;demo&quot; will be deleted.</p>
                </blockquote>
                <input data-form="delete" name="acl_name" type="hidden" value="demo">
              </div>

              <div class="modal-footer">
                <button class="btn btn-success" data-bs-dismiss="modal" aria-hidden="true">Cancel</button>
                <button class="btn btn-danger nd_adminbutton" name="delete" data-bs-dismiss="modal">Confirm</button>
              </div>
            </div>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<script>
  $(document).ready(function() {
    $('#data-table').dataTable({
    "columnDefs": [ {
        "targets": [ 1, 2, 3 ],
        "orderable": false,
        "searchable": false
      } ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
    } );
  } );
</script>
