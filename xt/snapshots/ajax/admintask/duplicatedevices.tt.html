
<div class="col-md-4 alert alert-info">No duplicate devices found.</div>

<script>
$(document).ready(function() {
  $('#data-table').dataTable({
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu":
