<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0"
  data-nd-table='{
  "columnDefs": [
    {
      "targets": [
        0,
        1,
        2
        ,3
      ],
      "orderable": false,
      "searchable": false
    }
  ]
}'>
  <thead>
    <tr>
      <th class="nd_center-cell">Ruleset ID</th>
      <th class="nd_center-cell">Match Host(s)</th>
      <th class="nd_center-cell">Match Port(s) (optional)</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td></td>

      <td>
        <input class="form-control w-auto d-inline-block nd_acl_host_searcher" size=45 data-form="add" name="left_rule" type="text" placeholder="Hostname, IP, prefix, or property:value"
         autocomplete="off"
         data-nd-typeahead="/ajax/data/devices/typeahead"
         data-nd-typeahead-params=".nd_sidebar-form, self"
         data-nd-typeahead-open data-nd-typeahead-commit="acl">
      </td>

      <td>
        <input class="form-control w-auto d-inline-block" size=45 data-form="add" name="right_rule" type="text" placeholder="port:name, IP, or property:value">
      </td>

      <td class="nd_center-cell">
        <input data-form="add" name="acl_name" type="hidden" value="demo">
        <button class="btn btn-sm nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add Ruleset</button>
      </td>
    </tr>

    <tr class="nd_acl-rule-list">
      <td class="nd_center-cell">1</td>

      <td class="nd_acl-rule-list" data-field="nd_left-acl-rule-field">
        <div class="nd_acl-rule-list">
        <span class="badge text-bg-dark nd_left-acl-rule-label">192.0.2.0/24 <a class="nd_delete-me" href="#"><i class="fas fa-circle-xmark"></i></a></span>&nbsp;&nbsp;192.0.2.0/24
        <input class="nd_left-acl-rule-field" data-form="update" name="left_rule" type="hidden" value="1."><br/>
        <input class="form-control w-auto d-inline-block nd_acl-rule nd_acl_host_searcher" size=40 contenteditable="true" data-form="" name="left_rule" type="text" placeholder="add rule"
         autocomplete="off"
         data-nd-typeahead="/ajax/data/devices/typeahead"
         data-nd-typeahead-params=".nd_sidebar-form, self"
         data-nd-typeahead-open data-nd-typeahead-commit="acl">
        </div>
      </td>

      <td class="nd_acl-rule-list" data-field="nd_right-acl-rule-field">
        <div class="nd_acl-rule-list">
          <span class="badge text-bg-info nd_right-acl-rule-label">80 <a class="nd_delete-me" href="#"><i class="fas fa-circle-xmark"></i></a></span>
          <input class="nd_right-acl-rule-field" data-form="update" name="right_rule" type="hidden" value="1."><br/>
        <input class="form-control w-auto d-inline-block nd_acl-rule" size=40 contenteditable="true" data-form="" name="right_rule" type="text" placeholder="add rule">
        </div>
      </td>

      <td class="nd_center-cell">
        <input data-form="update" name="id" type="hidden" value="1">
        <input data-form="update" name="acl_name" type="hidden" value="demo">
        <button class="btn nd_adminbutton nd_disabled-feature" name="update" type="submit"><i class="far fa-floppy-disk text-warning"></i></button>

        <button class="btn" data-bs-toggle="modal"
          data-bs-target="#nd_devdel-1" type="button"><i class="fas fa-trash-can text-danger"></i></button>

        <div id="nd_devdel-1" class="nd_modal nd_deep-horizon modal fade" tabindex="-1"
          role="dialog" aria-labelledby="nd_devdel-label-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h3 id="nd_devdel-label-1">Are you sure?</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <blockquote>
                  <p class="text-info">
                    This ruleset with ID &quot;1&quot; will be deleted.</p>
                </blockquote>
                <input data-form="delete" name="id" type="hidden" value="1">
                <input data-form="delete" name="acl_name" type="hidden" value="demo">
                <input data-form="delete" name="acl_type" type="hidden" value="host_port">
              </div>

              <div class="modal-footer">
                <button class="btn btn-success" data-bs-dismiss="modal" aria-hidden="true">Cancel</button>
                <button class="btn btn-danger nd_adminbutton" name="delete" data-bs-dismiss="modal">Confirm</button>
              </div>
            </div>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>
