<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th class="nd_center-cell">ID</th>
      <th class="nd_center-cell">Match Host(s)</th>
      <th class="nd_center-cell">Match Port(s) (optional)</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td></td>

      <td>
        <input class="span3 nd_acl_host_searcher" data-form="add" name="left_rule" type="text" placeholder="Hostname, IP, prefix, or property:value">
      </td>

      <td>
        <input class="span3" data-form="add" name="right_rule" type="text" placeholder="port:name, IP, or property:value">
      </td>

      <td class="nd_center-cell">
        <input data-form="add" name="acl_name" type="hidden" value="demo">
        <button class="btn btn-small nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add</button>
      </td>
    </tr>

    <tr class="nd_acl-rule-list">
      <td class="nd_center-cell">1</td>

      <td class="nd_acl-rule-list" data-field="nd_left-acl-rule-field">
        <div class="nd_acl-rule-list">
        <span class="label label-inverse nd_left-acl-rule-label">192.0.2.0/24 <a class="nd_delete-me" href="#"><i class="fas fa-circle-xmark"></i></a></span>&nbsp;&nbsp;192.0.2.0/24
        <input class="nd_left-acl-rule-field" data-form="update" name="left_rule" type="hidden" value="1."><br/>
        <input class="span3 nd_acl-rule nd_acl_host_searcher" contenteditable="true" data-form="" name="left_rule" type="text" placeholder="add rule">
        </div>
      </td>

      <td class="nd_acl-rule-list" data-field="nd_right-acl-rule-field">
        <div class="nd_acl-rule-list">
          <span class="label label-info nd_right-acl-rule-label">80 <a class="nd_delete-me" href="#"><i class="fas fa-circle-xmark"></i></a></span>
          <input class="nd_right-acl-rule-field" data-form="update" name="right_rule" type="hidden" value="1."><br/>
        <input class="span3 nd_acl-rule" contenteditable="true" data-form="" name="right_rule" type="text" placeholder="add rule">
        </div>
      </td>

      <td class="nd_center-cell">
        <input data-form="update" name="id" type="hidden" value="1">
        <input data-form="update" name="acl_name" type="hidden" value="demo">
        <button class="btn nd_adminbutton nd_disabled-feature" name="update" type="submit"><i class="far fa-floppy-disk text-warning"></i></button>

        <button class="btn" data-toggle="modal"
          data-target="#nd_devdel-1" type="button"><i class="fas fa-trash-can text-error"></i></button>

        <div id="nd_devdel-1" class="nd_modal nd_deep-horizon modal hide fade" tabindex="-1"
          role="dialog" aria-labelledby="nd_devdel-label-1" aria-hidden="true">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-hidden="true">x</button>
            <h3 id="nd_devdel-label-1">Are you sure?</h3>
          </div>
          <div class="modal-body">
            <blockquote>
              <p class="text-info">
                This ruleset with ID &quot;1&quot; will be deleted.</p>
            </blockquote>
            <input data-form="delete" name="id" type="hidden" value="1">
            <input data-form="delete" name="acl_name" type="hidden" value="demo">
            <input data-form="delete" name="acl_type" type="hidden" value="host_port">
          </div>

          <div class="modal-footer">
            <button class="btn btn-success" data-dismiss="modal" aria-hidden="true">Cancel</button>
            <button class="btn btn-danger nd_adminbutton" name="delete" data-dismiss="modal">Confirm</button>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>

<script>
  $(document).ready(function() {
    $('#data-table').dataTable({
    "columnDefs": [ {
        "targets": [ 0, 1, 2, 3 ],
        "orderable": false,
        "searchable": false
      } ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'
    ,"language": {
      "search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
    } );

    $('.tab-content').on('click', '.nd_delete-me', function() {
      var btn = $(this).closest('tr').find('button.nd_adminbutton[name="update"]');
      var label = $(this).closest('span.nd_left-acl-rule-label, span.nd_right-acl-rule-label');
      $(label).next('input.nd_left-acl-rule-field, input.nd_right-acl-rule-field').remove();
      $(label).remove();
      $(btn).click(); // the label is deleted so need to use saved btn
    });
  } );
</script>
