<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th class="nd_center-cell">Device Name</th>
      <th class="nd_center-cell">Device IP</th>
      <th class="nd_center-cell">Number of Ports</th>
      <th class="nd_center-cell">Services</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="nd_center-cell"><input data-form="add" name="name" type="text"></td>
      <td class="nd_center-cell"><input data-form="add" name="ip" type="text"></td>
      <td class="nd_center-cell"><input data-form="add" name="ports" type="number" value="1"></td>
      <td class="nd_center-cell">
        <span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span>
        <a class="nd_layer-three-link" href="#" rel="tooltip" data-bs-placement="bottom" data-offset="3" data-bs-title="Enable Arpnip"><span class="badge text-bg-secondary">3</span></a><span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span>
        <input data-form="add" name="layers" type="hidden" value="00000000">
      </td>
      <td class="nd_center-cell">
        <button class="btn btn-sm nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add</button>
      </td>
    </tr>
  </tbody>
</table>

<script>
$(document).ready(function() {
  $('#data-table').dataTable({
    "columnDefs": [ {
        "targets": [ 2, 3 ],
        "orderable": false,
        "searchable": false
      } ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'
    ,"language": {
      "search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  } );
  $('.nd_layer-three-link').click(function() {
    var badge = $(this).children('span').first();
    var layers = $(this).parent().children('input').first();
    $(badge).toggleClass('text-bg-success');
    if ($(badge).hasClass('text-bg-success')) {
      $(layers).attr('value', '00000100');
    }
    else {
      $(layers).attr('value', '00000000');
    }
  });
} );
</script>
