<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0"
  data-nd-table='{"columnDefs":[{"targets":[2,3],"orderable":false,"searchable":false}]}'>
  <thead>
    <tr>
      <th class="nd_center-cell">Device Name</th>
      <th class="nd_center-cell">Device IP</th>
      <th class="nd_center-cell">Number of Ports</th>
      <th class="nd_center-cell">Services</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="nd_center-cell"><input class="form-control" data-form="add" name="name" type="text"></td>
      <td class="nd_center-cell"><input class="form-control" data-form="add" name="ip" type="text"></td>
      <td class="nd_center-cell"><input class="form-control" data-form="add" name="ports" type="number" value="1"></td>
      <td class="nd_center-cell">
        <span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span>
        <a class="nd_layer-three-link" href="#" rel="tooltip" data-bs-placement="bottom" data-bs-title="Enable Arpnip"><span class="badge text-bg-secondary">3</span></a><span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span><span class="badge text-bg-secondary">&nbsp;</span>
        <input data-form="add" name="layers" type="hidden" value="00000000">
      </td>
      <td class="nd_center-cell">
        <button class="btn btn-sm nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add</button>
      </td>
    </tr>
  </tbody>
</table>
