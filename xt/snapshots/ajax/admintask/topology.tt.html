<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0"
  data-nd-table='{"columnDefs":[{"targets":[4],"orderable":false,"searchable":false}]}'>
  <thead>
    <tr>
      <th class="nd_center-cell">Left Device</th>
      <th class="nd_center-cell">Left Port</th>
      <th class="nd_center-cell">Right Device</th>
      <th class="nd_center-cell">Right Port</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="nd_center-cell">
        <div class="input-group">
          <input data-form="add" class="nd_topo_dev nd_topo_dev1 form-control" name="dev1"
           autocomplete="off"
           data-nd-typeahead="/ajax/data/deviceip/typeahead" data-nd-typeahead-open="%" type="text" value="">
          <span class="input-group-text nd_topo_dev_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <div class="input-group">
          <input data-form="add" class="nd_topo_port nd_topo_dev1 form-control" name="port1"
           autocomplete="off"
           data-nd-typeahead="/ajax/data/port/typeahead"
           data-nd-typeahead-params=".nd_topo_dev1" data-nd-typeahead-open type="text" value="">
          <span class="input-group-text nd_topo_port_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <div class="input-group">
          <input data-form="add" class="nd_topo_dev nd_topo_dev2 form-control" name="dev2"
           autocomplete="off"
           data-nd-typeahead="/ajax/data/deviceip/typeahead" data-nd-typeahead-open="%"  type="text">
          <span class="input-group-text nd_topo_dev_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <div class="input-group">
          <input data-form="add" class="nd_topo_port nd_topo_dev2 form-control" name="port2"
           autocomplete="off"
           data-nd-typeahead="/ajax/data/port/typeahead"
           data-nd-typeahead-params=".nd_topo_dev2" data-nd-typeahead-open type="text">
          <span class="input-group-text nd_topo_port_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <button class="btn btn-sm nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add</button>
      </td>
    </tr>
  </tbody>
</table>
