<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th class="nd_center-cell">Left Device</th>
      <th class="nd_center-cell">Left Port</th>
      <th class="nd_center-cell">Right Device</th>
      <th class="nd_center-cell">Right Port</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="nd_center-cell">
        <div class="input-append">
          <input data-form="add" class="nd_topo_dev nd_topo_dev1" name="dev1" type="text" value="">
          <span class="add-on nd_topo_dev_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <div class="input-append">
          <input data-form="add" class="nd_topo_port nd_topo_dev1" name="port1" type="text" value="">
          <span class="add-on nd_topo_port_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <div class="input-append">
          <input data-form="add" class="nd_topo_dev nd_topo_dev2" name="dev2"  type="text">
          <span class="add-on nd_topo_dev_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <div class="input-append">
          <input data-form="add" class="nd_topo_port nd_topo_dev2" name="port2" type="text">
          <span class="add-on nd_topo_port_caret"><i class="fas fa-caret-down fa-lg"></i></span>
        </div>
      </td>
      <td class="nd_center-cell">
        <button class="btn btn-small nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add</button>
      </td>
    </tr>
  </tbody>
</table>

<script>
$(document).ready(function() {
  $('#data-table').dataTable({
    "columnDefs": [ {
        "targets": [ 4 ],
        "orderable": false,
        "searchable": false
      } ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'
    ,"language": {
      "search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  } );
} );
</script>
