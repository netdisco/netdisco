<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th class="nd_center-cell">Location</th>
      <th class="nd_center-cell">Device</th>
      <th class="nd_center-cell">System Name</th>
      <th class="nd_center-cell">Vendor</th>
      <th class="nd_center-cell">Model</th>
    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
    var table = $('#data-table').dataTable({
        "deferRender": true,
        "order": [[ 0, "asc" ], [2, "asc"], [ 3, "asc" ], [4, "asc"]],
        "data": ,
        "columns": [
           {
                "data": 'location',
                "render": function(data, type, row, meta) {
                  if (data) {
                    return '<a href="&q=' + encodeURIComponent(data) + '&location=' + encodeURIComponent(data) + '">' + DataTable.util.escapeHtml(data) + '</a>';

                  } else {
                    return '[Not Set]';
                  }
                }
            }, {
                "data": 'ip',
                "render": function(data, type, row, meta) {
                    return '<a href="?q=' + encodeURIComponent(data) + '">' + DataTable.util.escapeHtml(row.dns || row.ip) + '</a>';
                }
            }, {
                "data": 'name',
                "render": function(data, type, row, meta) {
                    return '<a href="&q=' + encodeURIComponent(data) + '&model=' + encodeURIComponent(data) + '">' + DataTable.util.escapeHtml(data || '') + '</a>';
                }
            }, {
                "data": 'vendor',
                "render": function(data, type, row, meta) {
                    return '<a href="&q=' + encodeURIComponent(data) + '&model=' + encodeURIComponent(data) + '">' + DataTable.util.escapeHtml(data || '') + '</a>';
                }
            }, {
                "data": 'model',
                "render": function(data, type, row, meta) {
                    return '<a href="&q=' + encodeURIComponent(data) + '&model=' + encodeURIComponent(data) + '">' + DataTable.util.escapeHtml(data || '') + '</a>';
                }
            }
        ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
    });

});
</script>
