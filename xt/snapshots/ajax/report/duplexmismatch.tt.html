<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>Left Device</th>
      <th>Port</th>
      <th>Duplex</th>
      <th>Right Device</th>
      <th>Port</th>
      <th>Duplex</th>
    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
  var table = $('#data-table').dataTable({
    "deferRender": true,
    "data": ,
    "columns": [
      {
        "data": 'left_ip',
        "render": function(data, type, row, meta) {
          return DataTable.util.escapeHtml(row.left_dns || row.left_ip);
        }
      }, {
        "data": 'left_port',
        "type": 'portsort',
        "render": function(data, type, row, meta) {
          return type === 'display' ?
            '<a href="&q=' + encodeURIComponent(row.left_dns || row.left_ip) + '&f=' + encodeURIComponent(data) + '&c_duplex=on">' + DataTable.util.escapeHtml(data || '') + '</a>' :
            DataTable.util.escapeHtml(data || '');
        }
      }, {
        "data": 'left_duplex',
        "render": function(data, type, row, meta) {
          return DataTable.util.escapeHtml(capitalizeFirstLetter(data || ''));
        }
      }, {
        "data": 'right_ip',
        "render": function(data, type, row, meta) {
          return DataTable.util.escapeHtml(row.right_dns || row.right_ip);
        }
      }, {
        "data": 'right_port',
        "type": 'portsort',
        "render": function(data, type, row, meta) {
          return type === 'display' ?
            '<a href="&q=' + encodeURIComponent(row.right_dns || row.right_ip) + '&f=' + encodeURIComponent(data) + '&c_duplex=on">' + DataTable.util.escapeHtml(data || '') + '</a>' :
            DataTable.util.escapeHtml(data || '');
        }
      }, {
        "data": 'right_duplex',
        "render": function(data, type, row, meta) {
          return DataTable.util.escapeHtml(capitalizeFirstLetter(data || ''));
        }
      }
    ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  });
});
</script>
