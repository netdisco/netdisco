<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>VLAN ID</th>

      <th>Device Count</th>

    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
  var table = $('#data-table').dataTable({
    "deferRender": true,
    "data": ,
    "columns": [
      {
        "data": 'vlan',
        "render": function(data, type, row, meta) {
          return '<a href="?tab=vlan&q=' + encodeURIComponent(data) + '">' + data + '</a>';
        }
      }, {
        "data": 'description',
        "render": function(data, type, row, meta) {
          let resp = '';
          for (let i = 0; i < data.length; i++) {
            resp += '<a href="?tab=vlan&q=' + encodeURIComponent(data[i]) + '">' + he.encode(data[i] || '') + '</a>';
            if (i < (data.length - 1)) {
              resp += ', ';
            }
          }
          return resp;
        }
      }, {
        "data": 'dcount',
        "searchable": false,
        "render": function(data, type, row, meta) {
          return data.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
      }, {
        "data": 'pcount',
        "searchable": false,
        "render": function(data, type, row, meta) {
          return data.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
      }

      "search": '_INPUT_'

      ,"infoFiltered": "(filtered from _MAX_ total)"

      // make sure filter is never saved

    }
  });
});
</script>
