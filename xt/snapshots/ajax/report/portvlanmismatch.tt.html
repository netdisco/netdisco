<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>Left Device</th>
      <th>Left Port</th>
      <th>Only Left VLANs</th>
      <th>Right Device</th>
      <th>Right Port</th>
      <th>Only Right VLANs</th>
    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
    var table = $('#data-table').dataTable({
        "deferRender": true,
        "data": ,
        "columns": [
               {
                "data": 'left_ip',
                "render": function(data, type, row, meta) {
                    return '<a href="&q=' + encodeURIComponent(data) + '">' + he.encode(row.left_dns || data || '') + '</a>'; }
            }, {
              "data": 'left_port',
              "type": 'portsort',
              "render": function(data, type, row, meta) {
                return type === 'display' ?
                  '<a href="&q=' + encodeURIComponent(row.left_ip) + '&f=' + encodeURIComponent(data) + '">' + he.encode(data || '') + '</a>'
                    + '<br />' + he.encode(row.left_port_descr || '')
                  : he.encode(data || ''); }
            }, {
                "data": 'only_left_vlans'
            }, {
                "data": 'right_ip',
                "render": function(data, type, row, meta) {
                    return '<a href="&q=' + encodeURIComponent(data) + '">' + he.encode(row.right_dns || data || '') + '</a>'; }
            }, {
              "data": 'right_port',
              "type": 'portsort',
              "render": function(data, type, row, meta) {
                return type === 'display' ?
                  '<a href="&q=' + encodeURIComponent(row.right_ip) + '&f=' + encodeURIComponent(data) + '">' + he.encode(data || '') + '</a>'
                    + '<br />' + he.encode(row.right_port_descr || '')
                  : he.encode(data || ''); }
            }, {
                "data": 'only_right_vlans'
            }
        ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
    });

});
</script>
