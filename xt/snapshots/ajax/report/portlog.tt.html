<table id="data-table" class="table table-bordered table-sm table-striped" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th class="nd_center-cell">Creation</th>
      <th class="nd_center-cell">User</th>
      <th class="nd_center-cell">User IP</th>
      <th class="nd_center-cell">Action</th>
      <th class="nd_center-cell">Reason</th>
      <th class="nd_center-cell">Log</th>
      <th class="nd_center-cell">Action</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="nd_center-cell">-</td>
      <td class="nd_center-cell"></td>
      <td class="nd_center-cell">-</td>
      <td class="nd_center-cell">comment</td>
      <td class="nd_center-cell">Other</td>
      <td class="nd_center-cell"><input data-form="add" class="col-md-4" name="log" type="text" placeholder="Add comment..."></td>
      <input data-form="add" name="ip" type="hidden" value="">
      <input data-form="add" name="port" type="hidden" value="">
      <td class="nd_center-cell">
        <button class="btn btn-sm nd_adminbutton" name="add" type="submit"><i class="fas fa-circle-plus"></i> Add</button>
      </td>
    </tr>

  </tbody>
</table>

<script>
$(document).ready(function() {
  $('#data-table').dataTable({
    sort: false,
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'
    ,"language": {
      "search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  } );
} );
</script>
