<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>IP Address</th>
      <th>MAC Address</th>
      <th>Vendor</th>
      <th class="nd_center-cell">DNS</th>
      <th class="nd_center-cell">NetBIOS</th>
      <th>Time Since Last Seen</th>      
    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
  var table = $('#data-table').dataTable({
    "deferRender": true,
    "data": ,
    "columns": [
      {
        "data": 'ip',
        "render": function(data, type, row, meta) {
          var cell_str = DataTable.util.escapeHtml(data);
          if (type == 'display') {
            if (row.time_last && row.node) {
              cell_str = '<a href="&q=' + encodeURIComponent(data)
                + (row.active ? '' : '&archived=on') + '">' + DataTable.util.escapeHtml(data)
                + (row.active ? '' : '&nbsp;<i class="fas fa-book text-warning"></i>&nbsp;') + '</a>';
            }
            else if (row.time_last) {
              cell_str = '<a href="&q=' + encodeURIComponent(data) + '">' + DataTable.util.escapeHtml(data) + '</a>';
            }
          }
          return cell_str;
        }
      }, {
        "data": 'mac',
        "render": function(data, type, row, meta) {
          var cell_str = DataTable.util.escapeHtml(data || '');
          if (type == 'display' && data && row.time_last) {
            cell_str = '<a href="&q=' + encodeURIComponent(data)
              + (row.active ? '' : '&archived=on') + '">' + DataTable.util.escapeHtml(data)
              + (row.active ? '' : '&nbsp;<i class="fas fa-book text-warning"></i>&nbsp;') + '</a>';
          }
          return cell_str;
        }
      }, {
        "data": 'vendor',
        "className": "nd_nowrap nd_center-cell",
        "render": function(data, type, row, meta) {
          return DataTable.util.escapeHtml(data || '');
        }
      }, {
        "data": 'dns',
        "className": "nd_nowrap nd_center-cell",
        "render": function(data, type, row, meta) {
          return DataTable.util.escapeHtml(data || '');
        }
      }, {
        "data": 'nbname',
        "className": "nd_nowrap nd_center-cell",
        "render": function(data, type, row, meta) {
          return DataTable.util.escapeHtml(data || '');
        }
      }, {
        "data": 'age',
        "render": function(data, type, row, meta) {
          if (type == 'display') {
            return DataTable.util.escapeHtml(data || 'Never').replace(/:00$/,' mins').replace(':',' hours ');
          }
          else {
            // so that sorting works correctly on this column
            return row.time_last;
          }
        }
      }
    ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  });
});
</script>
