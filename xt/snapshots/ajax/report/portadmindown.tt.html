<table id="data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>Device</th>
      <th>Port</th>
      <th>Port Description</th>      
      <th>Admin Status</th>
    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
  var table = $('#data-table').dataTable({
    "deferRender": true,
    "order": [[ 0, "asc" ], [1, "asc"]],
    "columns": [
      {
        "data": 'ip',
        "render": function(data, type, row, meta) {
          return he.encode(row.dns || row.name || row.ip);
        }
      }, {
        "data": 'port',
        "type": 'portsort',
        "render": function(data, type, row, meta) {
          return type === 'display' ?
            '<a href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(data) + '&c_nodes=on">' + he.encode(data || '') + '</a>' :
            he.encode(data || '');
        }
      }, {
        "data": 'description',
        "render": function(data, type, row, meta) {
          return he.encode(data || '');
        }
      }, {
        "data": 'up_admin',
        "orderable": false,
        "searchable": false,
        "render": function(data, type, row, meta) {
          return he.encode(data || '');
        }
      }
    ],
    "data": ,
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {
      "search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  });
});
</script>
