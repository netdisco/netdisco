<script>
$(document).ready(function() {
    $('#dp-data-table').dataTable({
        "columnDefs": [
            { "sortable": false, "targets": 0 },
            { "searchable": false, "targets": 0 },
            { "type": 'portsort', "targets": [ 'portsort' ] }
        ],
        "order": [[ 1, 'asc' ]],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
    } );

    // always rebind datatables row visibility toggle on tab load
    var [iplen, ipnum] = dataTablesDisablePaging();
    $('.nd_row-collapser-toggle').unbind('click', dataTablesRowGroupVisibilityToggle);
    $('.nd_row-collapser-toggle').bind('click', dataTablesRowGroupVisibilityToggle);

    // install row group filter and restore paging
    dataTablesPushRowGroupVisibilityFilter();
    dataTablesRestorePage(iplen, ipnum);
} );
</script>
