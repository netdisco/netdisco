<table id="da-data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>Address</th>
      <th>DNS</th>

      <th>Interface</th>
      <th>Description</th>
      <th>Prefix</th>
    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
  var table = $('#da-data-table').dataTable({
    "deferRender": true,
    "data": ,
    "columns": [
      {
        "data": 'alias',
        "render": function(data, type, row, meta) {
          return he.encode(data || '');
        }
      }, {
        "data": 'dns',
        "render": function(data, type, row, meta) {
          return he.encode(data || '');
        }
      }, {
        "data": 'port',
        "type": 'portsort',
        "render": function(data, type, row, meta) {
          return type === 'display' ?
            '<a href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(data) + '">' + he.encode(data || '') + '</a>' :
            he.encode(data || '');
        }
      }, {
        "data": 'device_port.name',
        "render": function(data, type, row, meta) {
          return he.encode(data || '');
        }
      }, {
        "data": 'subnet',
        "render": function(data, type, row, meta) {
          return ''
            + '<a href="&q=' + encodeURIComponent(data) + '&ip=' + encodeURIComponent(data) + '">' + he.encode(data || '') + '</a>';
        }
      }
    ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  });
});
</script>
