<div class="row">
    <div class="col-md-4">
        <div id="jstree" class="nd_scrollable" data-nd-device=""></div>
    </div>
    <div id="snmpnodecontainer" class="col-md-8">

        <form id="nd_snmp_search_form">
          <span class="form-group">

            <span class="nd_snmp_search_controls">
              <i id="nd_snmp_loading_spinner" class="far fa-circle fa-lg"></i>

              <input id="nd_snmp_search_text" type="text"
               class="form-control nd_snmp_search_param"
               name="term" required placeholder="Search for label or OID"
               autocomplete="off"
               data-nd-typeahead="/ajax/data/snmp/typeahead" data-nd-typeahead-min="2"
               data-nd-typeahead-params=".nd_snmp_search_param">

              <button type="submit" class="btn btn-secondary">Search</button>
            </span>

            &nbsp;
            <label class="form-check form-check-inline"
              rel="tooltip" data-bs-placement="top"
              data-bs-title="Anchored to the beginning">

              <input type="checkbox" id="nd_snmp_search_partial"
                name="partial" class="nd_snmp_search_param"> Partial </input>
            </label>

            &nbsp;

            <label class="form-check form-check-inline">
              <input type="checkbox" id="nd_snmp_search_deviceonly"
                name="deviceonly" class="nd_snmp_search_param"
                checked="checked"> Only this device
            </label>

            <input type="hidden" id="nd_snmp_search_ip"
              name="ip" class="nd_snmp_search_param" value="" />
          </span>
        </form>
        <div id="node">
          <table class="table table-bordered">
              <tbody>
                <tr>
                  <th scope="row" class="col-md-1">OID</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Module</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Leaf</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Status</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Access</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Type</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Index</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Filter</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Enum Syntax</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Description</th>
                  <td></td>
                </tr>
                <tr>
                  <th scope="row">Value</th>
                  <td></td>
                </tr>
              </tbody>    
            </table>
        </div>
    </div>
</div>
