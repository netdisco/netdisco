<table id="vs-data-table" class="table table-striped table-bordered" width="100%" cellspacing="0">
  <thead>
    <tr>
      <th>VLAN</th>
      <th>Device</th>
      <th>Description</th>
      <th>Ports</th>
      <th>Model</th>
      <th>OS</th>
      <th>Vendor</th>
    </tr>
  </thead>
</table>

<script type="text/javascript">
$(document).ready(function() {
  var table = $('#vs-data-table').dataTable({
    "deferRender": true,
    "data": ,
    "columns": [{
        "data": 'vlans.vlan',
        "render": function(data, type, row, meta) {
          return '<a class="nd_linkcell nd_stealth-link" href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(data) + '">' + data + '</a>';
        }
      }, {
        "data": 'ip',
        "render": function(data, type, row, meta) {
          return '<a href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(row.vlans.vlan) + '">' + he.encode(row.dns || row.ip) + '</a>';
        }
      }, {
        "data": 'vlans.description',
        "render": function(data, type, row, meta) {
          return '<a class="nd_linkcell nd_stealth-link" href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(row.vlans.vlan) + '">' + he.encode(data || '') + '</a>';
        }
      }, {
        "data": 'pcount',
        "searchable": false,
        "render": function(data, type, row, meta) {
          return '<a class="nd_linkcell nd_stealth-link" href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(row.vlans.vlan) + '">' + he.encode(data.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")) + '</a>';
        }
      }, {
        "data": 'model',
        "render": function(data, type, row, meta) {
          return '<a class="nd_linkcell nd_stealth-link" href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(row.vlans.vlan) + '">' + he.encode(data || '') + '</a>';
        }
      }, {
        "data": 'os',
        "render": function(data, type, row, meta) {
          return '<a class="nd_linkcell nd_stealth-link" href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(row.vlans.vlan) + '">' + he.encode(data || '') + '</a>';
        }
      }, {
        "data": 'vendor',
        "render": function(data, type, row, meta) {
          return '<a class="nd_linkcell nd_stealth-link" href="&q=' + encodeURIComponent(row.ip) + '&f=' + encodeURIComponent(row.vlans.vlan) + '">' + he.encode(data || '') + '</a>';
        }
      }
    ],
    "processing": true
    ,"stateSave": true
    ,"pageLength": 
    ,"lengthMenu": 
    ,"dom": '<"top"l<"nd_datatables-pager"p>f>rit<"bottom"><"clear">'

    ,"pagingType": 'simple_numbers'
    ,"language": {

      "processing": 'Processing...'
      ,"search": '_INPUT_'
      ,"searchPlaceholder": 'Filter records...'
      ,"lengthMenu": "Show _MENU_ records."
      ,"info":         "&nbsp;Showing _START_ to _END_ of _TOTAL_"
      ,"infoFiltered": "(filtered from _MAX_ total)"
      ,"infoEmpty":    "&nbsp;No matching entries"

      ,"paginate": {
        "previous": '&larr; Previous'
        ,"next":    'Next &rarr;'
      }
    }
    ,"stateSaveParams": function (settings, data) {
      // make sure filter is never saved
      data.search.search = "";
      // make sure paging position is not saved
      data.start = 0;
    }
  });
});</script>
