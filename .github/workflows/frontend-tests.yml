name: "Frontend unit tests"

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  portsort:
    name: portsort.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Name the test files rather than globbing them: `node --test` exits 0
      # when a glob matches nothing, so a moved or renamed file would leave this
      # job green with no tests run. Naming them makes that a hard failure.
      - name: Sort order for network interface names
        run: node --test xt/js/portsort.test.js

  view-templates:
    name: share/views/js scannability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Its own job rather than a step above, so a failure reads as "a view
      # template dropped out of code scanning" rather than as a port sorting
      # regression. Same naming rule as that job: name the file, never a glob.
      - name: Every view template parses or is excluded from code scanning
        run: node --test xt/js/view-templates.test.js

  netmap-loading:
    name: netmap first paint indicator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: The netmap pane announces its wait for the first paint
        run: node --test xt/js/netmap-loading.test.js

  netmap-legend:
    name: netmap legend containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: The colorby legend stays inside the map
        run: node --test xt/js/netmap-legend.test.js

  netmap-autosave:
    name: netmap autosave frequency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: The map is posted once per settle and once per drag
        run: node --test xt/js/netmap-autosave.test.js

  no-jstree:
    name: the SNMP tree is server rendered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: No shipped script drives jsTree and the library is gone
        run: node --test xt/js/no-jstree.test.js

  typeahead:
    name: the suggestion menus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: The component's logic answers correctly without a browser
        run: node --test xt/js/typeahead-core.test.js

      - name: The component binds once on the document and builds no markup
        run: node --test xt/js/typeahead-source.test.js

  deferred-nodes:
    name: deferred node list recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: A failed deferred node fetch can be retried
        run: node --test xt/js/deferred-nodes.test.js

  tooltip-dismissal:
    name: tooltip dismissal on hide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Hiding an element dismisses its tooltip
        run: node --test xt/js/tooltip-dismissal.test.js

  pane-settling:
    name: pane held until it settles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: A swapped pane stays hidden until its DOM goes quiet
        run: node --test xt/js/pane-settling.test.js

  no-fragment-scripts:
    name: no template-generated JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Every file carrying JavaScript is static or on the shrinking list
        run: node --test xt/js/no-fragment-scripts.test.js

  tables-registry:
    name: DataTable renderer registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Every renderer and callback a fragment names exists
        run: node --test xt/js/tables-registry.test.js

  error-reporter:
    name: global script error reporter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: A script error or a failed swap reaches the console and the user
        run: node --test xt/js/error-reporter.test.js

  page-registry:
    name: page registry and admin split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: netdisco-admin.js registers with ndPages and carries no admin code left in netdisco.js
        run: node --test xt/js/page-registry.test.js

  history-ownership:
    name: history handed to htmx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Nothing drives the browser history by hand
        run: node --test xt/js/history-ownership.test.js

  tab-request-sync:
    name: tab request cancellation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Nothing cancels an abandoned tab request by hand
        run: node --test xt/js/tab-request-sync.test.js

  submit-dispatch:
    name: sidebar form submit dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Nothing builds a form submit event by hand
        run: node --test xt/js/submit-dispatch.test.js

  pane-chrome:
    name: per-tab chrome from the response
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Nothing rebuilds the csv or reset link by hand
        run: node --test xt/js/pane-chrome.test.js

  request-helper:
    name: shared ajax request and serialization helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Requests carry the header ajax routes require and fields serialize the way the server expects
        run: node --test xt/js/request-helper.test.js

  sort-types:
    name: version and address sort types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The version and address sort plug-ins are registered with the library
        run: node --test xt/js/sort-types.test.js

  sticky-header:
    name: results header stays in view
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The results table header is stuck by the stylesheet and by no plug-in
        run: node --test xt/js/sticky-header.test.js

  daterange-presets:
    name: date range preset arithmetic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Each preset resolves to the right pair of dates
        run: node --test xt/js/daterange-presets.test.js

  toast:
    name: Bootstrap toast notifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: A toast is built and dismissed without toastr
        run: node --test xt/js/toast.test.js

  toggle-build:
    name: sidebar toggle build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The vendored toggle file draws the widget on its own
        run: node --test xt/js/toggle-build.test.js

  no-jquery:
    name: no jQuery in the shipped tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: No shipped script calls jQuery and the library is gone
        run: node --test xt/js/no-jquery.test.js

  navbar-submenu:
    name: reaching a navbar submenu item
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: Arrow keys move within a dropend submenu, and the pointer can reach it
        run: node --test xt/js/navbar-submenu.test.js

  disco-queue:
    name: queueing from the Discover box
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Same naming rule as the jobs above: name the file, never a glob.
      - name: The Discover box queues over ajax and reports either way
        run: node --test xt/js/disco-queue.test.js

  snmp-tree-control:
    name: the SNMP tree's open control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: The open control is stacked above the lines it sits on
        run: node --test xt/js/snmp-tree-control.test.js

  snmp-tree-dblclick:
    name: double-click on an SNMP tree label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: A double-click toggles the node and asks for the panel once
        run: node --test xt/js/snmp-tree-dblclick.test.js
