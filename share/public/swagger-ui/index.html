<!-- HTML for static distribution bundle build -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="./swagger-ui.css" >
    <link rel="icon" type="image/png" href="./favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="./favicon-16x16.png" sizes="16x16" />
    <style>
      html
      {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }

      *,
      *:before,
      *:after
      {
        box-sizing: inherit;
      }

      body
      {
        margin:0;
        background: #fafafa;
      }
    </style>
  </head>

  <body>
    <div id="swagger-ui"></div>

    <script src="./swagger-ui-bundle.js"> </script>
    <script src="./swagger-ui-standalone-preset.js"> </script>
    <script>
    window.onload = function() {
      // Swagger UI 4.1.3 and later ignore ?url= unless queryConfigEnabled is
      // set, and that switch also re-enables configUrl and every other query
      // key, so the parameter is read here instead of by the bundle.
      //
      // Netdisco itself no longer sends one: Web.pm used to redirect to
      // /swagger-ui/?url=... because the 3.20.3 page needed telling where its
      // definition lived, and the fallback below made that redundant. The
      // handling stays because a bookmark, a proxy or a third party can still
      // put a ?url= in a link, and that request must be answered safely rather
      // than trusted.
      //
      // Resolve the candidate and compare origins rather than matching the
      // string. Pattern matching is not sufficient: for http and https the URL
      // parser treats a backslash as a path separator, so "/\evil.com/x.json"
      // looks relative and resolves to another origin.
      //
      // The path is pinned as well, because same origin alone would accept any
      // JSON an attacker could get served from this host. Web.pm only ever
      // builds uri_for('/swagger.json'), and a path-prefixed deployment still
      // ends in /swagger.json.
      //
      // Returning the path rather than resolved.href keeps the topbar URL field
      // reading "/swagger.json" as it did before this upgrade.
      function sameOriginSpecUrl(candidate) {
        if (!candidate) return null;
        var resolved;
        try {
          resolved = new URL(candidate, window.location.href);
        }
        catch (e) {
          return null;
        }
        if (resolved.origin !== window.location.origin) return null;
        if (!resolved.pathname.endsWith('/swagger.json')) return null;
        return resolved.pathname + resolved.search;
      }

      const requestedUrl = new URLSearchParams(window.location.search).get('url');
      const specUrl = sameOriginSpecUrl(requestedUrl) || '../swagger.json';

      // Begin Swagger UI call region
      const ui = SwaggerUIBundle({
        url: specUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        apisSorter: "alpha",
        operationsSorter: "alpha",
        docExpansion: "none",
        // The online validator badge is on by default and sends the definition
        // URL to a Swagger-hosted service on every page load, which for most
        // deployments means publishing an internal hostname. It cannot be seen
        // in local testing: the badge suppresses itself when the URL contains
        // localhost or 127.0.0.1.
        validatorUrl: null
      })
      // End Swagger UI call region

      window.ui = ui
    }
  </script>
  </body>
</html>
